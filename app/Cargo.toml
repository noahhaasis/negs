# Cross-platform GPUI desktop app for Negs.
# Standalone workspace so GPUI dependencies never affect the film engine's
# root Cargo.toml / Cargo.lock.
[workspace]
resolver = "2"

[package]
name = "negs-gpui"
version = "0.20.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "Negs"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
negs-app = { path = "../crates/negs-app" }
negs-marks = { path = "../crates/negs-marks" }
negs-library = { path = "../crates/negs-library" }
spektrafilm-io = { path = "../crates/spektrafilm-io", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
smallvec = "1"
serde_json = "1"
anyhow = "1"
async-channel = "2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[patch.crates-io]
rawler = { path = "../vendor/rawler" }
