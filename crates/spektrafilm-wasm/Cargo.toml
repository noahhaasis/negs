[package]
name = "spektrafilm-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spektrafilm-core.workspace = true
spektrafilm-gpu.workspace = true
spektrafilm-math.workspace = true
spektrafilm-io.workspace = true
serde_json.workspace = true
image.workspace = true
anyhow.workspace = true
web-time.workspace = true
wasm-bindgen = "0.2.121"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4.71"
js-sys = "0.3.98"
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# rawler (RAW decoding, via spektrafilm-io) generates UUIDs.
uuid = { version = "1", features = ["js"] }
wgpu = { workspace = true, features = ["webgpu"] }
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }
wasm-bindgen-rayon = { version = "1.3", optional = true }

[features]
# Rayon on Web Workers. Needs a build with atomics (see web/build.sh) and a
# cross-origin isolated page that runs the engine in a worker.
threads = ["dep:wasm-bindgen-rayon"]
