[package]
name = "spektrafilm-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["apple-raw"]
# Only compiled/linked on macOS. Disable for a portable rawler-only build.
apple-raw = []
precision-f64 = ["spektrafilm-math/precision-f64"]

[dependencies]
spektrafilm-math.workspace = true
image.workspace = true
anyhow.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
rawler = "0.8"
ab_glyph = "0.2.32"

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json.workspace = true
