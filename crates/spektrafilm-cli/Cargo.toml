[package]
name = "spektrafilm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "spektrafilm"
path = "src/main.rs"

[[bin]]
name = "spektrafilm-f64"
path = "src/main.rs"
required-features = ["precision-f64"]

[[bin]]
name = "decode_raw_gui"
path = "src/bin/decode_raw_gui.rs"

[[bin]]
name = "golden_inputs"
path = "src/bin/golden_inputs.rs"

[[bin]]
name = "golden_compare"
path = "src/bin/golden_compare.rs"

[[bin]]
name = "golden_probes"
path = "src/bin/golden_probes.rs"

[features]
precision-f64 = [
    "spektrafilm-math/precision-f64",
    "spektrafilm-core/precision-f64",
    "spektrafilm-gpu/precision-f64",
    "spektrafilm-io/precision-f64",
]

[dependencies]
spektrafilm-core.workspace = true
spektrafilm-gpu.workspace = true
spektrafilm-math.workspace = true
spektrafilm-io.workspace = true
clap.workspace = true
serde_json.workspace = true
image.workspace = true
exr.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rayon.workspace = true
tiff = "0.10"
# golden_probes drives the numpy-compatible samplers with their own MT19937.
rand_mt = "5"
