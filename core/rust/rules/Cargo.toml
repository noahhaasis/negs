# windows/src's pure rules on the shared Odin core (core/src/rules): each
# module keeps its Rust API (plain data types stay Rust), the logic runs in
# Odin through the C ABI. windows/src/<module>.rs re-exports it, so no call
# site changes; core/diff holds the frozen Rust originals as oracles.
[package]
name = "negs-core-rules"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]

[features]
# Count the core's allocations, so tests can check nothing leaks.
track = ["negs-core-sys/track"]

[dependencies]
negs-core-sys = { path = "../sys" }

# Phase 3b: the picture rules keep windows/src's types, serde included
# (sidecars and sessions), and the engine's (BorderStyle, FilmFormat, Crop).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
spektrafilm-io = { path = "../../../crates/spektrafilm-io", default-features = false }

# The engine's rawler, as windows/Cargo.toml patches it (vendor/README.md).
[patch.crates-io]
rawler = { path = "../../../vendor/rawler" }
