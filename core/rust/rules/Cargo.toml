# windows/src's pure rules on the shared Odin core (core/src/rules): each
# module keeps its Rust API (plain data types stay Rust), the logic runs in
# Odin through the C ABI. windows/src/<module>.rs re-exports it, so no call
# site changes; core/diff holds the frozen Rust originals as oracles.
[package]
name = "negs-core-rules"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]

[features]
# Count the core's allocations, so tests can check nothing leaks.
track = ["negs-core-sys/track", "negs-library/track"]
# PhotoFacts::read, which asks the engine for the file's EXIF (Phase 3c).
io = []
# Phase 4b: windows/'s test builds (its dev-dependency turns it on), as
# cfg!(test) was there: a scratch profile folder, and the test-only
# Library::new and Preferences::expanded.
host-tests = []

[dependencies]
negs-core-sys = { path = "../sys" }
# Phase 3a: the library's Filter and Item (sheet_rules, compare), from the
# core's library under the name windows/ gives it.
negs-library = { package = "negs-core-library", path = "../library" }
# model_compare's filtered resize and overlay (the host's half of
# over_frame), as windows/ has it.
image = { version = "0.25", default-features = false }
# Phase 3b: the picture rules keep windows/src's types, serde included
# (sidecars and sessions), and the engine's (BorderStyle, FilmFormat, Crop).
# Phase 3c: tone_graph's helper replies; photo_facts' EXIF (feature io).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
spektrafilm-io = { path = "../../../crates/spektrafilm-io", default-features = false }
# Phase 4b: presets and session keep windows/src's anyhow results.
anyhow = "1"

# The engine's rawler, as the workspace and windows/ patch it.
[patch.crates-io]
rawler = { path = "../../../vendor/rawler" }
