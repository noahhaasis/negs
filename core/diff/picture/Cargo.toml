# Phase 3b's oracles: windows/src's crop, border, histogram, negative and
# thumb_compose as they were before they moved onto the core (frozen in
# core/diff/oracle), with the small stand-ins for the windows crate they
# name (`crate::state`, `crate::json`, `crate::gpu`). Their own crate, so
# those stand-ins sit at its root without meeting the other slices'.
[package]
name = "negs-core-diff-picture"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
path = "lib.rs"
test = false
doctest = false

[dependencies]
spektrafilm-io = { path = "../../../crates/spektrafilm-io", default-features = false }
spektrafilm-math = { path = "../../../crates/spektrafilm-math" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
