# Phase 4's oracles: windows/src's state, json, session, presets, batch,
# match_cache and rendered_preview as they were on b05e49e (frozen in
# core/diff/oracle), with the windows/src items they reach through
# `crate::` copied as they were (src/copied.rs) and portable stand-ins for
# the Win32 calls (windows/, src/lib.rs's `platform` and `stand_ins`). Its
# own crate, so its `crate::state` and `crate::json` don't meet other
# slices' oracles. Phase 3b's frozen border and crop come along, as
# state.rs names them.
[package]
name = "negs-state-oracle"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
build = "build.rs"

[lib]
test = false
doctest = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
spektrafilm-io = { path = "../../../crates/spektrafilm-io", default-features = false }
# batch's Item and match_cache's sha256, from the Rust library.
negs_library = { package = "negs-library", path = "../../../crates/negs-library" }
# border.rs's film-border pictures, as Phase 3b's oracles have it.
image = { version = "0.25", default-features = false, features = ["png"] }

# The Win32 calls: the real `windows` crate on Windows, as windows/ has it
# (named `windows` in src/lib.rs, as Cargo wants one source per name); the
# portable stand-ins (windows/) everywhere else.
[target.'cfg(windows)'.dependencies]
windows-crate = { package = "windows", version = "0.58", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem"] }

[target.'cfg(not(windows))'.dependencies]
windows = { package = "negs-windows-stand-in", path = "windows" }
