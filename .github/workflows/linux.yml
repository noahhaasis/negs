name: Linux

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux.yml'
      - '.github/workflows/release.yml'
      - 'Cargo.*'
      - 'crates/**'
      - 'data/**'
      - 'linux/**'
      - 'scripts/check_native_macos.py'
      - 'docs/linux-*.md'
      - 'assets/negs-icon.*'

permissions:
  contents: read

jobs:
  arch:
    name: Arch Linux x86_64
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 90
    env:
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      AUR_MAINTAINER: ${{ vars.AUR_MAINTAINER }}
      # Bound BLAS threads on shared runners; CI verifies CPU fallback.
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Install Arch build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed git python rustup pkgconf gtk4 libadwaita openblas vulkan-icd-loader hicolor-icon-theme desktop-file-utils
          useradd --create-home builder
      - uses: actions/checkout@v4
      - name: Give the build user ownership of the checkout
        run: chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Test release metadata and recipe generation
        run: runuser -u builder -- python3 -I -m unittest discover -s linux -p 'test_release.py'
      - name: Archive this commit and prepare local recipe
        run: runuser -u builder -- python3 linux/release.py prepare
      - name: Build and test both workspaces as an unprivileged user
        run: |
          cd target/linux-release/build
          runuser -u builder -- makepkg --cleanbuild --force --noconfirm
      - name: Verify the packaged engine and desktop integration files
        run: runuser -u builder -- python3 linux/verify_package.py target/linux-release/build/negs-*.pkg.tar.zst
      - name: Generate checksummed assets, AUR recipes and Omarchy submission
        run: runuser -u builder -- python3 linux/release.py finish --package target/linux-release/build/negs-*.pkg.tar.zst
      - name: Verify the per-user bundle includes and uses OpenBLAS
        run: |
          mkdir -p target/linux-bundle-check
          tar -xzf target/linux-release/assets/negs-*-linux-x86_64.tar.gz -C target/linux-bundle-check
          chown -R builder:builder target/linux-bundle-check
          runuser -u builder -- python3 linux/verify_package.py --prefix target/linux-bundle-check --require-bundled-openblas
      - uses: actions/upload-artifact@v4
        with:
          name: negs-linux
          path: target/linux-release/assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: negs-linux-recipes
          path: target/linux-release/recipes/
          include-hidden-files: true
          if-no-files-found: error

  flatpak:
    name: Flatpak x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata and Cargo source lists
        run: |
          python3 linux/release.py metadata
          python3 linux/flatpak/cargo_sources.py --check
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils xvfb xauth
          # Ubuntu 24.04 restricts the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          df -h /
      - uses: actions/cache@v4
        with:
          path: |
            target/flatpak/state/cache
            target/flatpak/state/downloads
          key: flatpak-${{ hashFiles('linux/flatpak/*.json') }}-${{ github.sha }}
          restore-keys: flatpak-${{ hashFiles('linux/flatpak/*.json') }}-
      - name: Build the Flatpak bundle offline from this checkout
        run: bash linux/flatpak/build.sh target/flatpak/out
      - name: Install and verify inside the sandbox
        run: xvfb-run -a bash linux/flatpak/verify.sh target/flatpak/out/negs-*-linux-x86_64.flatpak
      - name: Record checksums and disk usage
        run: |
          cd target/flatpak/out
          sha256sum negs-*-linux-x86_64.flatpak > SHA256SUMS-flatpak
          cat SHA256SUMS-flatpak
          du -sh "$GITHUB_WORKSPACE/target/flatpak" ~/.local/share/flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: negs-linux-flatpak
          path: target/flatpak/out/
          if-no-files-found: error

  appimage:
    name: AppImage x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Archive this commit
        run: python3 linux/release.py prepare --out target/appimage/release
      - uses: actions/cache@v4
        with:
          # The pinned GTK/libadwaita/OpenBLAS stack, source downloads and crates.
          path: |
            target/appimage/cache/stack-*
            target/appimage/cache/src
            target/appimage/cache/cargo/registry
          key: appimage-${{ hashFiles('linux/appimage/Dockerfile', 'linux/appimage/build.sh', 'linux/appimage/*.patch') }}-${{ hashFiles('Cargo.lock', 'linux/Cargo.lock') }}
          restore-keys: appimage-${{ hashFiles('linux/appimage/Dockerfile', 'linux/appimage/build.sh', 'linux/appimage/*.patch') }}-
      - name: Build in the Ubuntu 24.04 baseline container
        run: |
          archive=$(echo target/appimage/release/assets/negs-*.tar.gz)
          bash linux/appimage/package.sh "$archive" target/appimage/out
          cat target/appimage/out/library-ledger.json
      - name: Run on clean Ubuntu 24.04, Fedora and Arch without GTK 4
        run: bash linux/appimage/smoke.sh target/appimage/out/Negs-*-x86_64.AppImage ubuntu fedora arch
      - name: Record checksums
        run: |
          cd target/appimage/out
          mkdir -p ../validation && mv library-ledger.json ../validation/
          sha256sum Negs-*-x86_64.AppImage negs-*-appimage-sources.tar > SHA256SUMS-appimage
          cat SHA256SUMS-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: negs-linux-appimage
          path: target/appimage/out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: negs-linux-appimage-ledger
          path: target/appimage/validation/
          retention-days: 14

