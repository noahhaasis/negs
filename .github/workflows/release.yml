name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Docs-only pushes to main build nothing. Path filters never apply to tags,
    # so every release tag builds and publishes all platforms.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "release/**"

permissions:
  contents: read

# Tags queue behind each other and are never cancelled. A newer push to a
# branch supersedes its unfinished build, and branch runs never hold up a tag.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'release-publish' || format('release-build-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Choose platforms
    runs-on: ubuntu-latest
    outputs:
      # Tags and manual runs build everything; pushes to main build only the
      # platforms the push can affect.
      linux: ${{ github.event_name != 'push' || github.ref_type == 'tag' || steps.filter.outputs.linux == 'true' }}
      windows: ${{ github.event_name != 'push' || github.ref_type == 'tag' || steps.filter.outputs.windows == 'true' }}
      macos: ${{ github.event_name != 'push' || github.ref_type == 'tag' || steps.filter.outputs.macos == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          filters: |
            shared: &shared
              - ".github/workflows/release.yml"
              - "Cargo.*"
              - "crates/**"
              - "data/**"
              - "assets/**"
              - "release/**"
            linux:
              - *shared
              - ".github/workflows/linux.yml"
              - "linux/**"
              - "scripts/check_native_macos.py"
            windows:
              - *shared
              - "windows/**"
            macos:
              - *shared
              - "macos/**"
              - "scripts/**"

  linux:
    name: Linux x86_64
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    uses: ./.github/workflows/linux.yml

  windows-test:
    name: Windows tests
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows -> windows/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test Windows app
        run: cargo test --locked --manifest-path windows/Cargo.toml

  windows-engine:
    name: Windows engine
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Separate invocations prevent f64 feature unification changing the preview.
      - name: Build engine executables
        run: |
          cargo build --release --locked -p spektrafilm-native
          cargo build --release --locked -p spektrafilm-cli --bin spektrafilm
          cargo build --release --locked -p spektrafilm-cli --features precision-f64 --bin spektrafilm-f64
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-engine
          path: |
            target/release/spektrafilm-native.exe
            target/release/spektrafilm.exe
            target/release/spektrafilm-f64.exe
          if-no-files-found: error
          retention-days: 1

  windows-app:
    name: Windows app
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows -> windows/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Negs.exe
        run: cargo build --release --locked --manifest-path windows/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-app
          path: windows/target/release/Negs.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows x64
    needs: [windows-engine, windows-app]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: build-windows-engine
          path: target/release
      - uses: actions/download-artifact@v4
        with:
          name: build-windows-app
          path: windows/target/release
      - name: Build installer and portable package
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { throw 'Inno Setup 6 compiler is missing from the runner.' }
          ./windows/package.ps1 -Iscc $iscc -Prebuilt
      - name: Verify and name release assets
        run: python windows/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: negs-windows
          path: target/windows-release/
          if-no-files-found: error

  macos-engine:
    name: macOS engine ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # Keep the binary deployment target consistent with Info.plist.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Record toolchain
        run: rustc -vV
      # Separate invocations prevent f64 feature unification changing the preview.
      - name: Build engine executables
        run: |
          cargo build --locked --release -p spektrafilm-native --target ${{ matrix.target }}
          cargo build --locked --release -p spektrafilm-cli --bin spektrafilm --target ${{ matrix.target }}
          cargo build --locked --release -p spektrafilm-cli --bin spektrafilm-f64 --features precision-f64 --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-macos-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/spektrafilm-native
            target/${{ matrix.target }}/release/spektrafilm
            target/${{ matrix.target }}/release/spektrafilm-f64
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS universal
    needs: macos-engine
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # The repository URL is supplied by GitHub; no owner is hard-coded.
      RELEASE_REPOSITORY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository || '' }}
      RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      SPARKLE_PUBLIC_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.SPARKLE_PUBLIC_KEY || '' }}
      UPDATE_FEED_URL: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.UPDATE_FEED_URL || '' }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      name: ${{ steps.metadata.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release metadata
        id: metadata
        run: python scripts/macos_release.py --github-output "$GITHUB_OUTPUT"
      - name: Record toolchains
        run: |
          swift --version
          xcodebuild -version
          test "$(uname -m)" = arm64
      - name: Test release metadata
        run: python -m unittest discover -s scripts -p 'test_macos_release.py'
      - uses: actions/download-artifact@v4
        with:
          name: build-macos-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release
      - uses: actions/download-artifact@v4
        with:
          name: build-macos-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release
      - name: Restore executable bits lost in artifact upload
        run: chmod +x target/*-apple-darwin/release/spektrafilm*
      - name: Package and verify app, update ZIP and installer
        env:
          BUILD_TARGET_DIR: target
          NEGS_PREBUILT_RUST: "1"
        run: bash scripts/package_macos_app.sh
      # The Swift tests run the engine from target/release.
      - name: Test native app and session restoration
        run: |
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/spektrafilm-native target/aarch64-apple-darwin/release/spektrafilm-f64 target/release/
          swift test --package-path macos --force-resolved-versions
      - name: Smoke-test the Intel slice under Rosetta
        run: |
          app=dist/negs-macos/Negs.app/Contents
          arch -x86_64 "$app/MacOS/spektrafilm" list-profiles --data-dir "$app/Resources/data" > /dev/null
          arch -x86_64 "$app/MacOS/spektrafilm-f64" list-profiles --data-dir "$app/Resources/data" > /dev/null
      - name: Sign and verify update feed
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python scripts/prepare_macos_update.py --tools target/swift-native/artifacts/sparkle/Sparkle/bin
      - uses: actions/upload-artifact@v4
        with:
          name: negs-macos
          path: dist/releases/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          path: dist/update-site/

  publish:
    name: Publish complete release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, windows-test, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: negs-{macos,windows,linux,linux-flatpak,linux-appimage}
          path: release-assets
          merge-multiple: true
      # Linux includes the Flatpak and AppImage jobs; neither format may be
      # missing, renamed or mismatched with its checksum file.
      - name: Check the complete expected asset list
        run: python3 scripts/check_release_assets.py "${{ needs.macos.outputs.version }}" release-assets
      - name: Create draft, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.macos.outputs.tag }}
          RELEASE_VERSION: ${{ needs.macos.outputs.version }}
        run: |
          # Never overwrite published artifacts. A failed draft can be removed
          # explicitly before retrying; a failed Pages deploy can be rerun alone.
          flags=()
          if [[ "$RELEASE_VERSION" == 0.* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" --title "Negs $RELEASE_VERSION" --notes-file "release/notes/$RELEASE_VERSION.md" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Check public update archive is downloadable
        env:
          RELEASE_TAG: ${{ needs.macos.outputs.tag }}
          ASSET_NAME: ${{ needs.macos.outputs.name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: curl --fail --location --retry 5 --retry-all-errors --output /dev/null "https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/$ASSET_NAME.zip"

  deploy-feed:
    name: Publish update feed last
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
