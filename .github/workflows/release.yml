name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Docs-only pushes to main build nothing. Path filters never apply to tags:
    # a tag on a commit main built green reuses that run and repackages only
    # the Mac app; any other tag builds and publishes all platforms.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "release/**"

permissions:
  contents: read
  # A tag reuses the artifacts of main's run of the same commit.
  actions: read

# Tags queue behind each other and are never cancelled. A newer push to a
# branch supersedes its unfinished build, and branch runs never hold up a tag.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'release-publish' || format('release-build-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Choose platforms
    runs-on: ubuntu-latest
    outputs:
      # Manual runs build everything; pushes to main build only the platforms
      # the push can affect. A tag reuses main's green run of the same commit
      # (engines, Windows and Linux packages, all tests) and only repackages
      # the Mac app with the update feed; without one it builds everything.
      reuse: ${{ steps.reuse.outputs.run }}
      linux: ${{ github.event_name != 'push' || (github.ref_type == 'tag' && steps.reuse.outputs.run == '') || steps.filter.outputs.linux == 'true' }}
      windows: ${{ github.event_name != 'push' || (github.ref_type == 'tag' && steps.reuse.outputs.run == '') || steps.filter.outputs.windows == 'true' }}
      macos: ${{ github.event_name != 'push' || (github.ref_type == 'tag' && steps.reuse.outputs.run == '') || steps.filter.outputs.macos == 'true' }}
      android: ${{ github.event_name != 'push' || (github.ref_type == 'tag' && steps.reuse.outputs.run == '') || steps.filter.outputs.android == 'true' }}
    steps:
      - name: Find main's green run of this commit
        id: reuse
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Main and the tag are often pushed together: wait for main's run.
          runs="repos/$REPO/actions/workflows/release.yml/runs?head_sha=$SHA&branch=main&event=push"
          for _ in $(seq 120); do
            pending=$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            [ "$pending" = 0 ] && break
            echo "Waiting for main's run of $SHA"; sleep 30
          done
          need='["build-macos-aarch64-apple-darwin","build-macos-x86_64-apple-darwin","negs-windows","negs-windows-arm64","negs-linux","negs-linux-flatpak","negs-linux-appimage","negs-android"]'
          for id in $(gh api "$runs" --jq '.workflow_runs[] | select(.conclusion == "success") | .id'); do
            have=$(gh api "repos/$REPO/actions/runs/$id/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired | not) | .name]')
            if jq -e --argjson need "$need" '. as $have | $need - $have | length == 0' <<<"$have" > /dev/null; then
              echo "Reusing run $id"; echo "run=$id" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "No complete green run of $SHA on main; building everything"
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          filters: |
            shared: &shared
              - ".github/workflows/release.yml"
              - "Cargo.*"
              - "crates/**"
              - "data/**"
              - "assets/**"
              - "release/**"
            linux:
              - *shared
              - ".github/workflows/linux.yml"
              - "linux/**"
              - "scripts/check_native_macos.py"
            windows:
              - *shared
              - "windows/**"
            macos:
              - *shared
              - "core/**"
              - "macos/**"
              - "scripts/**"
            android:
              - *shared
              - "android/**"
              - "web/locales/**"
              - "web/sample/DSC_6377.dng"

  linux:
    name: Linux x86_64
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    uses: ./.github/workflows/linux.yml

  windows-test:
    name: Windows tests ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          # Native Windows on Arm, so ARM64 is built and tested without cross-compiling.
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows -> windows/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test Windows app
        run: cargo test --locked --manifest-path windows/Cargo.toml
      # The marks' geometry and the pure rules the app includes by #[path]
      # (library map, tray, strip and grid). bash, so any failure fails the step.
      - name: Test the marks and the Windows rules
        shell: bash
        run: |
          set -e
          cargo test --locked --manifest-path windows/Cargo.toml -p negs-marks
          for crate in library-map tray-rules sheet-rules; do
            cargo test --locked --manifest-path "windows/$crate/Cargo.toml" --target-dir windows/target
          done

  windows-engine:
    name: Windows engine ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          # Native Windows on Arm, so ARM64 is built and tested without cross-compiling.
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Separate invocations prevent f64 feature unification changing the preview.
      - name: Build engine executables
        run: |
          cargo build --release --locked -p spektrafilm-native
          cargo build --release --locked -p spektrafilm-cli --bin spektrafilm
          cargo build --release --locked -p spektrafilm-cli --features precision-f64 --bin spektrafilm-f64
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-engine-${{ matrix.arch }}
          path: |
            target/release/spektrafilm-native.exe
            target/release/spektrafilm.exe
            target/release/spektrafilm-f64.exe
          if-no-files-found: error
          retention-days: 1

  windows-app:
    name: Windows app ${{ matrix.arch }}
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          # Native Windows on Arm, so ARM64 is built and tested without cross-compiling.
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows -> windows/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Negs.exe
        run: cargo build --release --locked --manifest-path windows/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-app-${{ matrix.arch }}
          path: windows/target/release/Negs.exe
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows ${{ matrix.arch }}
    needs: [windows-engine, windows-app]
    # Both on x64, where Inno Setup is installed: packaging only copies,
    # compresses and checks the executables' architecture. x64 keeps the
    # artifact name tag runs reuse and earlier releases used.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            artifact: negs-windows
          - arch: arm64
            artifact: negs-windows-arm64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: build-windows-engine-${{ matrix.arch }}
          path: target/release
      - uses: actions/download-artifact@v4
        with:
          name: build-windows-app-${{ matrix.arch }}
          path: windows/target/release
      - name: Build installer and portable package
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { throw 'Inno Setup 6 compiler is missing from the runner.' }
          ./windows/package.ps1 -Iscc $iscc -Prebuilt -Arch ${{ matrix.arch }}
      - name: Verify and name release assets
        run: python windows/verify_package.py --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/windows-release/
          if-no-files-found: error

  macos-engine:
    name: macOS engine ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      # Keep the binary deployment target consistent with Info.plist.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Record toolchain
        run: rustc -vV
      # Separate invocations prevent f64 feature unification changing the preview.
      - name: Build engine executables
        run: |
          cargo build --locked --release -p spektrafilm-native --target ${{ matrix.target }}
          cargo build --locked --release -p spektrafilm-cli --bin spektrafilm --target ${{ matrix.target }}
          cargo build --locked --release -p spektrafilm-cli --bin spektrafilm-f64 --features precision-f64 --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-macos-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/spektrafilm-native
            target/${{ matrix.target }}/release/spektrafilm
            target/${{ matrix.target }}/release/spektrafilm-f64
          if-no-files-found: error
          # Kept for a week so a tag made days later can still reuse them.
          retention-days: 7

  macos:
    name: macOS universal
    needs: [changes, macos-engine]
    # With a reused run, macos-engine is skipped and its engines come from there.
    if: ${{ !cancelled() && (needs.macos-engine.result == 'success' || (needs.changes.result == 'success' && needs.changes.outputs.reuse != '')) }}
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # The repository URL is supplied by GitHub; no owner is hard-coded.
      RELEASE_REPOSITORY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository || '' }}
      RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      SPARKLE_PUBLIC_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.SPARKLE_PUBLIC_KEY || '' }}
      UPDATE_FEED_URL: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.UPDATE_FEED_URL || '' }}
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      name: ${{ steps.metadata.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release metadata
        id: metadata
        run: python scripts/macos_release.py --github-output "$GITHUB_OUTPUT"
      - name: Record toolchains
        run: |
          swift --version
          xcodebuild -version
          test "$(uname -m)" = arm64
      - name: Test release metadata
        run: python -m unittest discover -s scripts -p 'test_macos_release.py'
      - uses: actions/download-artifact@v4
        with:
          name: build-macos-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release
          run-id: ${{ needs.changes.outputs.reuse || github.run_id }}
          github-token: ${{ needs.changes.outputs.reuse != '' && github.token || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: build-macos-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release
          run-id: ${{ needs.changes.outputs.reuse || github.run_id }}
          github-token: ${{ needs.changes.outputs.reuse != '' && github.token || '' }}
      - name: Restore executable bits lost in artifact upload
        run: chmod +x target/*-apple-darwin/release/spektrafilm*
      - name: Install the shared core's pinned Odin
        run: python core/install_odin.py
      - name: Test the shared core
        run: python core/build.py test
      - name: Package and verify app, update ZIP and installer
        env:
          BUILD_TARGET_DIR: target
          NEGS_PREBUILT_RUST: "1"
        run: bash scripts/package_macos_app.sh
      # The Swift tests run the engine from target/release. A reused run
      # passed them on this commit; only Info.plist's update feed differs.
      - name: Test native app and session restoration
        if: needs.changes.outputs.reuse == ''
        run: |
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/spektrafilm-native target/aarch64-apple-darwin/release/spektrafilm-f64 target/release/
          swift test --package-path macos --force-resolved-versions
      - name: Smoke-test the Intel slice under Rosetta
        run: |
          app=dist/negs-macos/Negs.app/Contents
          arch -x86_64 "$app/MacOS/spektrafilm" list-profiles --data-dir "$app/Resources/data" > /dev/null
          arch -x86_64 "$app/MacOS/spektrafilm-f64" list-profiles --data-dir "$app/Resources/data" > /dev/null
      - name: Sign and verify update feed
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python scripts/prepare_macos_update.py --tools target/swift-native/artifacts/sparkle/Sparkle/bin
      - uses: actions/upload-artifact@v4
        with:
          name: negs-macos
          path: dist/releases/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          path: dist/update-site/

  android:
    name: Android arm64
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Ensure Android NDK 28 and SDK 35 are installed
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ndk="$sdk/ndk/28.2.13676358"
          if [ ! -d "$ndk" ] || [ ! -d "$sdk/platforms/android-35" ] || [ ! -d "$sdk/build-tools/35.0.0" ]; then
            set +o pipefail
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Check Android translations
        run: node android/check-i18n.mjs
      - name: Build Android engine (aarch64-linux-android)
        run: bash android/build-engine.sh --locked
      - name: Build and sign release APK
        env:
          IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ks=""
          cleanup() { [ -n "$ks" ] && rm -f "$ks"; }
          trap cleanup EXIT
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            ks="$(mktemp "${RUNNER_TEMP:-/tmp}/negs-android.XXXXXX.keystore")"
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ks"
            export ANDROID_KEYSTORE_PATH="$ks"
          fi
          if [ "$IS_TAG" = "true" ]; then
            export NEGS_REQUIRE_RELEASE_SIGNING=1
          fi
          (cd android && ./gradlew assembleRelease --no-daemon)
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          version=$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')
          out="target/android-release"
          mkdir -p "$out"
          asset="Negs-${version}-android-arm64.apk"
          cp "$apk" "$out/$asset"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$sdk/build-tools/35.0.0/apksigner"
          certs=$("$apksigner" verify --print-certs "$out/$asset")
          printf '%s\n' "$certs"
          if [ "$IS_TAG" = "true" ]; then
            if printf '%s\n' "$certs" | grep -q "CN=Android Debug"; then
              echo "Refusing to ship a debug-signed APK on a release tag" >&2
              exit 1
            fi
          fi
          (cd "$out" && sha256sum "$asset" > SHA256SUMS-android.txt)
          ls -lh "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: negs-android
          path: target/android-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish complete release
    # Windows and Linux are skipped when reused; any failure stops the release.
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.macos.result == 'success' && !contains(needs.*.result, 'failure') }}
    needs: [changes, macos, windows, windows-test, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: negs-{macos,windows,windows-arm64,linux,linux-flatpak,linux-appimage,android}
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.reuse != ''
        with:
          pattern: negs-{windows,windows-arm64,linux,linux-flatpak,linux-appimage,android}
          path: release-assets
          merge-multiple: true
          run-id: ${{ needs.changes.outputs.reuse }}
          github-token: ${{ github.token }}
      # Linux includes the Flatpak and AppImage jobs; neither format may be
      # missing, renamed or mismatched with its checksum file.
      - name: Check the complete expected asset list
        run: python3 scripts/check_release_assets.py "${{ needs.macos.outputs.version }}" release-assets
      - name: Create draft, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.macos.outputs.tag }}
          RELEASE_VERSION: ${{ needs.macos.outputs.version }}
        run: |
          # Never overwrite published artifacts. A failed draft can be removed
          # explicitly before retrying; a failed Pages deploy can be rerun alone.
          flags=()
          if [[ "$RELEASE_VERSION" == 0.* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" --title "Negs $RELEASE_VERSION" --notes-file "release/notes/$RELEASE_VERSION.md" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Check public update archive is downloadable
        env:
          RELEASE_TAG: ${{ needs.macos.outputs.tag }}
          ASSET_NAME: ${{ needs.macos.outputs.name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: curl --fail --location --retry 5 --retry-all-errors --output /dev/null "https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/$ASSET_NAME.zip"

  deploy-feed:
    name: Publish update feed last
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
