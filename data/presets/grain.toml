# --- Negs only, not upstream: Negs' datasheet Tri-X 400 and the B&W films
# ported from Fotufilm (CC BY-SA 4.0, MUAStudio Inc.). rms_granularity is
# the datasheet's diffuse RMS granularity (48 um aperture, net D 1.0), which
# is Fotufilm's grainStrength x 1000; Tri-X 400 (Kodak F-4017, 10-21, p7: 17, HC-110 B),
# T-MAX 100 (Kodak F-4016) and Acros 100 II (Fujifilm AF3-0259E) checked
# against the datasheet. Uniformity, density_min and sublayers come
# from [defaults.bw.negative].
[ilford_delta_3200]
rms_granularity = [19.0]

[kodak_trix400_d76_8min]
rms_granularity = [17.0]

[ilford_hp5_plus]
rms_granularity = [16.0]

[ilford_fp4_plus]
rms_granularity = [10.0]

[kodak_tmax_100]
rms_granularity = [8.0]

[fujifilm_acros_100_ii]
rms_granularity = [7.0]

# --- Negs only, not upstream: the colour films ported from Fotufilm (CC BY-SA
# 4.0, MUAStudio Inc.), scaled to this table from the stocks both share (see
# docs/handoff-fotufilm-grain.md). Where Fotufilm's grainStrength is the
# datasheet figure (Fujifilm still negatives, every slide film, Aerocolor
# 2460), it matches this table 1:1 (C-200, X-TRA 400, Pro 400H, Provia 100F,
# Ektachrome 100, Kodachrome 64) and is used x 1000. Fotufilm's other figures
# read 1.9x this table on Gold 200, UltraMax 400, Ektar 100 and Portra 400, so
# they are scaled by 0.525 (least squares). The Fujifilm cine films take the
# Vision3 250D/500T fit (x 1.54 on Fotufilm's per-layer figure, its layer
# weights included). CineStill 800T is Vision3 500T and takes its section.
# Rounded to 0.5. Uniformity, density_min and sublayers come from the colour
# defaults unless set.
[fujifilm_superia_200]
rms_granularity = [4.0, 4.0, 4.0]

[fujifilm_reala_100]
rms_granularity = [4.0, 4.0, 4.0]

[fujifilm_pro_160ns]
rms_granularity = [3.0, 3.0, 3.0]

[kodak_aerocolor_2460]
rms_granularity = [8.5, 8.5, 8.5]

[kodak_kodacolor_100]
rms_granularity = [5.0, 5.0, 5.0]

[lomography_color_100]
rms_granularity = [3.5, 3.5, 3.5]

[cinestill_400d]
rms_granularity = [4.0, 4.0, 4.0]

[lomography_lomochrome_metropolis]
rms_granularity = [6.0, 6.0, 6.0]

[lomography_lomochrome_turquoise]
rms_granularity = [6.5, 6.5, 6.5]

[harman_phoenix_200]
