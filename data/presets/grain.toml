# Grain presets per film stock, from spektrafilm by Andrea Volpato
# (https://github.com/andreavolpato/spektrafilm), experimental branch at
# 28bf883, src/spektrafilm/data/presets/grain.toml. CC BY-SA 4.0, like the
# profiles in data/profiles. Unmodified apart from this header and the
# Negs-only block at the end (see data/CHANGELOG.txt).
# Read by crates/spektrafilm-core/src/grain.rs (upstream
# runtime/params_builder.py `_apply_grain_preset`).

# --- defaults
[defaults.bw.negative] # roughly modeled after kodak_doublex
rms_granularity = [14.0]
uniformity = [0.6]
density_min = [0.01]
particle_scale_sublayers = [1.0, 0.4, 0.25]

[defaults.bw.positive] # roughly modeled after kodak_trix
rms_granularity = [44.0]
uniformity = [0.6]
density_min = [0.003]
particle_scale_sublayers = [1.0, 0.4, 0.25]

[defaults.color.negative] # roughly modeled after kodak_vision3_50d
rms_granularity = [7.0, 7.0, 12.0]
uniformity = [0.97, 0.97, 0.97]
density_min = [0.03, 0.03, 0.03]
particle_scale_sublayers = [1.0, 0.4, 0.25]

[defaults.color.positive]
rms_granularity = [7.0, 7.0, 12.0]
uniformity = [0.97, 0.97, 0.97]
density_min = [0.03, 0.03, 0.03]
particle_scale_sublayers = [1.0, 0.4, 0.25]


