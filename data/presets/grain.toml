[fujifilm_velvia_100]
rms_granularity = [8.0, 8.0, 8.0]

[fujifilm_provia_100f]
rms_granularity = [8.0, 8.0, 8.0]


# --- cine color negative
[kodak_vision3_50d]
rms_granularity = [7.0, 7.0, 12.0]
uniformity = [0.97, 0.95, 0.97]

[kodak_vision3_250d]
