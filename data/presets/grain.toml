[kodak_portra_400]
rms_granularity = [4.5, 4.5, 4.5]

[kodak_portra_800]
rms_granularity = [6.0, 6.0, 6.0]

[kodak_portra_800_push1]
rms_granularity = [7.0, 7.0, 7.0]

[kodak_portra_800_push2]
rms_granularity = [9.0, 9.0, 9.0]

[fujifilm_c200]
rms_granularity = [4.0, 4.0, 4.0]

[fujifilm_xtra_400]
rms_granularity = [4.0, 4.0, 4.0]

[fujifilm_pro_400h]
rms_granularity = [4.0, 4.0, 4.0]


# --- still color positive
[kodak_ektachrome_100]
