# The Windows app: Win32 with the common controls, wgpu for the photograph.
# Its own workspace, like macos/, so building it never changes the engine's
# feature unification or lock file. See docs/windows-app.md.
[workspace]
resolver = "2"
# The marks' Rust geometry, kept as the shared core's test oracle.
members = ["marks"]

[package]
name = "negs-windows"
version = "0.20.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "Negs"
path = "src/main.rs"

[dependencies]
# Crop, border and 35mm geometry, so the canvas cuts the same pixels as the exporter.
spektrafilm-io = { path = "../crates/spektrafilm-io", default-features = false }
# The image buffers spektrafilm-io crops and borders, for edited thumbnails.
spektrafilm-math = { path = "../crates/spektrafilm-math" }
serde = { version = "1", features = ["derive"] }
# Exact float reading: the catalog's defaults must equal the sidecar tables' to the bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
anyhow = "1"
# The `implement` macro refers to windows-core by name.
windows-core = "0.58"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
# Vulkan only, as decided in docs/windows-agent-handoff.md.
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
rawler = "0.8"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
# The pencil marks' geometry, from the shared Odin core (core/src/marks)
# with windows/marks's API; windows/marks stays as its test oracle.
negs-marks = { package = "negs-core-marks", path = "../core/rust/marks" }
# The library: .negs sidecars, ratings, flags, per-photograph edits, undo,
# from the shared Odin core (core/src/library) with negs-library's API.
negs-library = { package = "negs-core-library", path = "../core/rust/library" }
# The themes' tables, names and colour maths (core/src/theme).
negs-core-sys = { path = "../core/rust/sys" }
# windows/src's pure rules (Phase 3), from the shared Odin core.
# Feature io: PhotoFacts::read through spektrafilm-io (Phase 3c).
negs-core-rules = { path = "../core/rust/rules", features = ["io"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_EventLog",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_ColorSystem",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[dev-dependencies]
spektrafilm-math = { path = "../crates/spektrafilm-math" }
# Phase 4b: the tests' cfg!(test) in the core's session and presets (a
# scratch profile, Library::new, Preferences::expanded).
negs-core-rules = { path = "../core/rust/rules", features = ["io", "host-tests"] }

# The engine's rawler (spektrafilm-io uses its develop_intermediate_owned);
# see vendor/README.md.
[patch.crates-io]
rawler = { path = "../vendor/rawler" }
