# The strip's and the grid's rules (windows/src/sheet_rules.rs), compiled
# from the app's own source so their tests run on any OS:
#   cargo test --manifest-path windows/sheet-rules/Cargo.toml --target-dir target/sheet-rules
[package]
name = "negs-windows-sheet-rules"
version = "0.18.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Its own workspace: not part of the app's.
[workspace]

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# The rules now come from the shared Odin core, through negs-core-rules,
# with the core's library under the name the app gives it.
negs-library = { package = "negs-core-library", path = "../../core/rust/library" }
negs-core-rules = { path = "../../core/rust/rules" }

# negs-core-rules brings the engine (spektrafilm-io) with it: its
# rawler, as the app uses it (vendor/README.md).
[patch.crates-io]
rawler = { path = "../../vendor/rawler" }
