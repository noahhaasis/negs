# The Windows app's library glue that has no Win32 in it: the mapping
# between the editor's state and the sidecar's edits, the library's
# preferences, keys and undo steps (windows/src/model/library_map.rs), with
# the editor state it maps (state.rs, crop.rs, border.rs, json.rs) compiled
# from the app's own sources. Its tests run on any OS:
#   cargo test --manifest-path windows/library-map/Cargo.toml --target-dir target/library-map
[package]
name = "negs-windows-library-map"
version = "0.18.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Its own workspace: not part of the app's.
[workspace]

[lib]
path = "src/lib.rs"
# The included files' own unit tests need the rest of the app; the tests
# here are in tests/.
test = false
doctest = false

[dependencies]
spektrafilm-io = { path = "../../crates/spektrafilm-io", default-features = false }
# The library as the app has it: the shared Odin core's (core/src/library),
# with negs-library's API; its photographs are compare.rs's items.
negs-library = { package = "negs-core-library", path = "../../core/rust/library" }
serde = { version = "1", features = ["derive"] }
# Exact float reading: the catalog's defaults must equal the sidecar tables' to the bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# The shared Odin core's rules, which compare.rs, crop.rs, border.rs and
# negative.rs re-export (Phase 3).
negs-core-rules = { path = "../../core/rust/rules" }
# state.rs's one Win32 call, stood in for.
windows = { package = "negs-windows-stub", path = "windows-stub" }

# The engine's rawler, as the app uses it (vendor/README.md).
[patch.crates-io]
rawler = { path = "../../vendor/rawler" }
