# The app's library glue tests (re-exported from `crates/negs-app`):
#   cargo test --manifest-path windows/library-map/Cargo.toml --target-dir target/library-map
[package]
name = "negs-windows-library-map"
version = "0.20.3"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# Its own workspace: not part of the app's.
[workspace]

[lib]
path = "src/lib.rs"
test = false
doctest = false

[dependencies]
negs-app = { path = "../../crates/negs-app" }
negs-library = { path = "../../crates/negs-library" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# The engine's rawler, as the app uses it (vendor/README.md).
[patch.crates-io]
rawler = { path = "../../vendor/rawler" }
