<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPad stability test</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#161616;color:#eee;font:15px system-ui}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  aside{position:fixed;z-index:2;top:8px;right:8px;width:min(390px,calc(100vw - 48px));padding:16px;background:#232323f5;border:1px solid #555;border-radius:10px;box-shadow:0 4px 20px #0008}
  h1{font-size:17px;margin:0 0 8px}p{margin:8px 0;line-height:1.4}button{font:inherit;padding:10px 18px;background:#e8ad57;color:#161616;border:0;border-radius:6px}
  small{color:#bbb;overflow-wrap:anywhere}aside[data-status=failed]{border-color:#ef7a71}aside[data-status=passed]{border-color:#7ec99a}
</style>
<iframe id="app" title="Editor under test"></iframe>
<aside id="panel">
  <h1>iPad stability test</h1>
  <p id="status">Runs the Fuji RAW through slider, zoom, export, and prolonged editing tests. Keep Safari in front.</p>
  <button id="start">Start tests</button>
  <p><small id="details">Results are saved to the Mac over local Wi-Fi. The image stays on this local network.</small></p>
</aside>
<script type="module" src="./ipad-runner.mjs"></script>
