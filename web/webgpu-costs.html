<!doctype html>
<!-- What WebGPU objects and passes cost in this browser: open /webgpu-costs.html from web/serve.mjs; the timings go to web/results/webgpu-costs.json. -->
<script type="module">
const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
const device = await adapter.requestDevice();
const N = 200, PX = 133 * 200;
const code = `
struct P { n: u32, k: f32 }
@group(0) @binding(0) var<uniform> p: P;
@group(0) @binding(1) var<storage, read_write> a: array<f32>;
@compute @workgroup_size(256) fn main(@builtin(global_invocation_id) g: vec3<u32>) {
  if (g.x < p.n) { a[g.x] = a[g.x] * 0.999 + p.k; }
}`;
const pipe = device.createComputePipeline({ layout: "auto", compute: { module: device.createShaderModule({ code }), entryPoint: "main" } });
const img = device.createBuffer({ size: PX * 12, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
const uni = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM, mappedAtCreation: true });
new Uint32Array(uni.getMappedRange())[0] = PX * 3; uni.unmap();
const bg0 = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: uni } }, { binding: 1, resource: { buffer: img } }] });
const groups = Math.ceil(PX * 3 / 256);
async function time(name, f) {
  const out = [];
  for (let r = 0; r < 6; r++) {
    const t = performance.now();
    await f();
    await device.queue.onSubmittedWorkDone();
    out.push(performance.now() - t);
  }
  out.shift();
  out.sort((a, b) => a - b);
  return [name, +out[2].toFixed(2)];
}
const res = [];
res.push(await time("empty submit", async () => device.queue.submit([device.createCommandEncoder().finish()])));
res.push(await time(`${N} passes, 1 dispatch each, cached bg`, async () => {
  const e = device.createCommandEncoder();
  for (let i = 0; i < N; i++) { const p = e.beginComputePass(); p.setPipeline(pipe); p.setBindGroup(0, bg0); p.dispatchWorkgroups(groups); p.end(); }
  device.queue.submit([e.finish()]);
}));
res.push(await time(`1 pass, ${N} dispatches, cached bg`, async () => {
  const e = device.createCommandEncoder();
  const p = e.beginComputePass(); p.setPipeline(pipe);
  for (let i = 0; i < N; i++) { p.setBindGroup(0, bg0); p.dispatchWorkgroups(groups); }
  p.end();
  device.queue.submit([e.finish()]);
}));
res.push(await time(`${N} passes + new uniform(mappedAtCreation)+bg each`, async () => {
  const e = device.createCommandEncoder();
  const keep = [];
  for (let i = 0; i < N; i++) {
    const u = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM, mappedAtCreation: true });
    new Uint32Array(u.getMappedRange())[0] = PX * 3; u.unmap();
    const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: u } }, { binding: 1, resource: { buffer: img } }] });
    keep.push(u);
    const p = e.beginComputePass(); p.setPipeline(pipe); p.setBindGroup(0, bg); p.dispatchWorkgroups(groups); p.end();
  }
  device.queue.submit([e.finish()]);
  for (const u of keep) u.destroy();
}));
res.push(await time(`${N} new uniform(mappedAtCreation) only`, async () => {
  for (let i = 0; i < N; i++) {
    const u = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM, mappedAtCreation: true });
    new Uint32Array(u.getMappedRange())[0] = 1; u.unmap(); u.destroy();
  }
}));
res.push(await time(`${N} new uniform via writeBuffer`, async () => {
  for (let i = 0; i < N; i++) {
    const u = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(u, 0, new Uint32Array([1, 0, 0, 0]));
  }
}));
res.push(await time(`${N} new bind groups only`, async () => {
  for (let i = 0; i < N; i++) device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: uni } }, { binding: 1, resource: { buffer: img } }] });
}));
for (const px of [PX, 900_000, 4_000_000]) {
  res.push(await time(`6 new image buffers ${px} px, used once`, async () => {
    const e = device.createCommandEncoder();
    const bufs = [];
    for (let i = 0; i < 6; i++) {
      const b = device.createBuffer({ size: px * 12, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
      bufs.push(b);
      const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: uni } }, { binding: 1, resource: { buffer: b } }] });
      const p = e.beginComputePass(); p.setPipeline(pipe); p.setBindGroup(0, bg); p.dispatchWorkgroups(1); p.end();
    }
    device.queue.submit([e.finish()]);
    await device.queue.onSubmittedWorkDone();
    bufs.forEach((b) => b.destroy());
  }));
}
for (const px of [PX, 900_000, 4_000_000]) {
  const rb = () => device.createBuffer({ size: px * 12, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const src = device.createBuffer({ size: px * 12, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const keep = rb();
  res.push(await time(`readback ${px} px f32x3, new buffer`, async () => {
    const b = rb();
    const e = device.createCommandEncoder(); e.copyBufferToBuffer(src, 0, b, 0, px * 12); device.queue.submit([e.finish()]);
    await b.mapAsync(GPUMapMode.READ); new Float32Array(b.getMappedRange()).slice(); b.destroy();
  }));
  res.push(await time(`readback ${px} px f32x3, reused buffer`, async () => {
    const e = device.createCommandEncoder(); e.copyBufferToBuffer(src, 0, keep, 0, px * 12); device.queue.submit([e.finish()]);
    await keep.mapAsync(GPUMapMode.READ); new Float32Array(keep.getMappedRange()).slice(); keep.unmap();
  }));
}
await fetch("/result?name=webgpu-costs", { method: "POST", body: JSON.stringify({ adapter: adapter.info.description || adapter.info.vendor, res }) });
document.body.textContent = JSON.stringify(res);
</script>
