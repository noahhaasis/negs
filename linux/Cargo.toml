# Native UI workspace: keep GTK's dependency graph separate from engine precision features.
[workspace]
resolver = "2"

[package]
name = "negs-linux"
version = "0.7.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0"
publish = false

[[bin]]
name = "negs"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
